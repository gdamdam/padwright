name: Build desktop releases

# Fires on semver tag pushes (v1.0.0, v1.2.3, etc.) and on manual dispatch
# from the Actions tab. Pre-release tags (e.g. v1.0.0-beta.1) become
# pre-releases on GitHub.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write   # tauri-action creates/uploads to GitHub Releases

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest         # arm64
            target: aarch64-apple-darwin
            label: macos-arm64
          - platform: macos-13             # x86_64 Intel runner
            target: x86_64-apple-darwin
            label: macos-x64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # ── Toolchains ──────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust (stable, with target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      # ── Linux: Tauri & GTK dev libs ─────────────────────────────────────
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # ── Python deps + dev/test deps ─────────────────────────────────────
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # ── Install ffmpeg for tests (uses the real binary in test e2e) ─────
      # On Linux, ffmpeg comes from apt above. On macOS use Homebrew (free
      # on GitHub-hosted runners). Windows uses choco.
      - name: Install ffmpeg for tests
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   brew install ffmpeg ;;
            Linux)   sudo apt-get install -y ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # ── Tests gate the build — failing tests do not produce a release ───
      - name: Run tests
        run: python tests.py

      # ── Python sidecar ──────────────────────────────────────────────────
      # Sidecars must exist before `cargo check`/Tauri build: tauri.conf.json
      # declares them under bundle.externalBin and the build script resolves
      # the per-target paths (binaries/padwright-server-<triple>, etc.) at
      # configure time. Missing files = fail.
      - name: Bundle Python web/app.py into padwright-server
        run: |
          pyinstaller --clean pyinstaller_app.spec
          node scripts/install_sidecar.mjs

      # ── ffmpeg + ffprobe sidecars ───────────────────────────────────────
      # GITHUB_TOKEN authenticates the macOS-arm64 path's api.github.com
      # call (martin-riedl/ffmpeg release discovery). Without it the
      # shared-IP CI runner hits the 60-req/hr unauth rate limit fast.
      - name: Download & install ffmpeg / ffprobe (LGPL builds)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci_download_ffmpeg.mjs --target ${{ matrix.target }}

      # ── npm deps (provides tauri-cli for the icon-regen step + bundle) ──
      - name: Install npm deps
        run: npm install

      # ── Icons ───────────────────────────────────────────────────────────
      # The committed icon.png at repo root is the master. tauri-cli
      # regenerates all derived files (PNG sizes, .icns, .ico, mobile +
      # store variants) into src-tauri/icons/ on every build.
      - name: Regenerate icons from master
        run: npx --yes @tauri-apps/cli icon icon.png

      # ── Cargo check — runs AFTER sidecars + icons exist, since tauri's
      #    build.rs validates externalBin paths during configure.
      - name: Cargo check (verify Rust compiles before full build)
        run: cargo check --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # ── Compose release notes from CHANGELOG + template ─────────────────
      # CHANGELOG.md is the source of truth for "what changed in this
      # version"; .github/RELEASE_NOTES_TEMPLATE.md wraps it with the
      # install instructions and first-launch warning copy.
      - name: Compose release notes
        id: notes
        shell: bash
        run: |
          set -e
          node scripts/compose_release_notes.mjs \
            --version "${{ github.ref_name }}" \
            --repo    "${{ github.repository }}" \
            > RELEASE_NOTES.md
          # Multiline output via $GITHUB_OUTPUT heredoc
          {
            echo "body<<RELNOTES_EOF"
            cat RELEASE_NOTES.md
            echo "RELNOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # ── Build the bundle and upload to a GitHub Release ─────────────────
      - name: Build Tauri bundle + create/update draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Padwright ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target ${{ matrix.target }}
          releaseBody: ${{ steps.notes.outputs.body }}

      # ── Surface artifacts in the Actions log too (useful when debugging) ─
      - name: Upload bundle as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: padwright-${{ matrix.label }}-${{ github.ref_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: ignore
          retention-days: 14
