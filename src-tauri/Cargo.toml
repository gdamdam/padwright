[package]
name = "sp404-toolkit"
version = "0.1.0"
description = "SP-404 MK2 Toolkit — desktop wrapper around the Python web UI"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sp404_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
