[package]
name = "padwright"
version = "1.0.0"
description = "Padwright — SP-404MKII Bank Builder. Tauri desktop shell."
authors = ["Padwright contributors"]
edition = "2021"
rust-version = "1.77"
license = "Apache-2.0"
repository = "https://github.com/padwright/padwright"

[lib]
name = "padwright_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
http = "1"
ureq = "2.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
